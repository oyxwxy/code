<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프롬프트 블로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Noto+Serif+KR:wght@400;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
.skin{--bg:#f7f8fa;--fg:#14161a;--card:#fff;--bd:#e3e5ea;--mu:#6b7280;--ac:#5b6cff;--ff:'Noto Sans KR',sans-serif}
.skin.dark{--bg:#111318;--fg:#e8eaf0;--card:#1b1e26;--bd:#2a2e39;--mu:#9097a8}
.skin.mist{--bg:#e9efee;--fg:#16231f;--card:#f5f9f8;--bd:#cfdcd9;--mu:#5b706a}
.skin.f-serif{--ff:'Noto Serif KR',serif}.skin.f-mono{--ff:'IBM Plex Mono','Noto Sans KR',monospace}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
.skin{min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.7 var(--ff);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto;padding:14px 18px}
.top b{font-size:18px;flex:1}.top a{font-size:14px;color:var(--mu)}.top a:hover{color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:6px 18px 90px}
.banner{height:150px;border-radius:14px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 30%,var(--bg)));background-size:cover;background-position:center;margin-bottom:14px}
.bh h1{margin:0;font-size:28px;line-height:1.3}.bh p{margin:4px 0 18px;color:var(--mu)}
.feed{display:flex;flex-direction:column;gap:14px}
.feed.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.feed.mag{display:grid;grid-template-columns:1fr 1fr}.feed.mag .post:first-child{grid-column:1/-1}
@media(max-width:520px){.feed.mag{grid-template-columns:1fr}}
.post{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.feed:not(.grid):not(.mag) .post{flex-direction:row}
.feed:not(.grid):not(.mag) .th{width:120px;min-height:100px;flex:none}
.th{aspect-ratio:4/3;background:color-mix(in srgb,var(--ac) 18%,var(--card)) center/cover;display:grid;place-items:center;font-size:28px;color:var(--ac)}
.mag .post:first-child .th{aspect-ratio:21/9}
.pb{padding:12px 14px}.pb h3{margin:0 0 4px;font-size:17px;line-height:1.4}
.meta{font-size:12px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{font:12px/1 'IBM Plex Mono',monospace;padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--fg);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--card))}
.chip.neg{background:color-mix(in srgb,#e33 12%,var(--card));border-color:color-mix(in srgb,#e33 30%,var(--card))}
h2.t{font-size:26px;line-height:1.35;margin:8px 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0}
.imgs img{width:100%;border-radius:10px;display:block}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.box h4{margin:0 0 6px;font-size:14px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:600 14px var(--ff);padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:#d33}
input,textarea,select{width:100%;font:15px var(--ff);padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--fg);margin:4px 0 10px}
textarea{min-height:110px;resize:vertical;font-family:'IBM Plex Mono','Noto Sans KR',monospace;font-size:13px}
label{font-size:13px;color:var(--mu);font-weight:600}
input[type=color]{padding:2px;height:40px;width:70px}input[type=checkbox]{width:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px}
.mu{color:var(--mu);font-size:14px}.sp{height:10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head>
<body><div id="root" class="skin"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== 여기만 바꾸세요 (Supabase > Project Settings > API) ======
const SB_URL='YOUR_SUPABASE_URL', SB_KEY='YOUR_SUPABASE_ANON_KEY';
// =================================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $root=document.getElementById('root');
let me=null,prof=null,recovery=false,draftTheme=null;
const VIS={public:'🌐 공개',locked:'🔑 비밀번호',private:'🔒 비공개'};
function h(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const $=id=>document.getElementById(id);
const fmt=d=>new Date(d).toLocaleDateString('ko-KR');
const err=e=>alert(e?.message||e);
const go=p=>{location.hash=p};
const DEF={accent:'#5b6cff',mode:'light',font:'sans',layout:'list'};
const th=p=>({...DEF,...(p?.theme||{})});

function skin(t){t={...DEF,...t};$root.className='skin '+(t.mode==='light'?'':t.mode)+' f-'+t.font;$root.style.setProperty('--ac',t.accent)}
function shell(content,t){
  skin(t||th(prof));
  const nav=h('div',{class:'top'},h('b',{},h('a',{href:'#/'},'🎨 프롬프트 블로그')),
    me?[h('a',{href:'#/new'},'글쓰기'),h('a',{href:'#/u/'+prof?.handle},'내 블로그'),h('a',{href:'#/me'},'설정')]:h('a',{href:'#/login'},'로그인'));
  $root.replaceChildren(nav,h('main',{},content));
}
function chips(txt,neg){return h('div',{class:'chips'},txt.split(/,(?![^()]*\))/).map(s=>s.trim()).filter(Boolean).map(s=>h('span',{class:'chip'+(neg?' neg':'')},s)))}
function copyBtn(txt,l='복사'){return h('button',{onclick:()=>navigator.clipboard.writeText(txt).then(()=>alert('복사됨'))},l)}

function feed(posts,layout){
  if(!posts.length)return h('p',{class:'mu'},'아직 글이 없어요.');
  return h('div',{class:'feed '+(layout==='grid'?'grid':layout==='mag'?'mag':'')},posts.map(p=>h('a',{class:'post',href:'#/p/'+p.id},
    h('div',{class:'th',style:p.cover?`background-image:url("${p.cover}")`:''},p.cover?'':(p.vis==='locked'?'🔑':'✦')),
    h('div',{class:'pb'},h('h3',{},p.title),h('div',{class:'meta'},(p.profiles?.display?p.profiles.display+' · ':'')+fmt(p.created)+(p.vis!=='public'?' · '+VIS[p.vis]:'')),
      p.tags?.length?h('div',{class:'meta'},p.tags.slice(0,5).map(x=>'#'+x).join(' ')):null))));
}

// ---------- 페이지들 ----------
async function home(){
  shell(h('p',{class:'mu'},'불러오는 중…'));
  const{data}=await sb.from('posts').select('id,title,tags,vis,cover,created,profiles(handle,display)').neq('vis','private').order('created',{ascending:false}).limit(60);
  shell([h('div',{class:'bh'},h('h1',{},'최근 올라온 프롬프트'),h('p',{},'멤버들이 공유한 글이에요.')),feed(data||[],th(prof).layout)]);
}
async function blog(handle){
  const{data:pf}=await sb.from('profiles').select('*').eq('handle',handle).single();
  if(!pf)return shell(h('p',{},'블로그를 찾을 수 없어요.'));
  const t=th(pf);
  const{data}=await sb.from('posts').select('id,title,tags,vis,cover,created').eq('owner',pf.id).order('created',{ascending:false});
  const own=me&&me.id===pf.id;
  shell([h('div',{class:'banner',style:t.banner?`background-image:url("${t.banner}")`:''}),h('div',{class:'bh'},h('h1',{},pf.display||pf.handle),h('p',{},pf.bio||'@'+pf.handle)),
    own?h('p',{},h('a',{class:'btn p',href:'#/new'},'+ 새 글')):null,feed(data||[],t.layout)],t);
}
async function post(id){
  const{data:p}=await sb.from('posts').select('*,profiles(*)').eq('id',id).single();
  if(!p)return shell(h('p',{},'글을 찾을 수 없거나 볼 권한이 없어요.'));
  const t=th(p.profiles),own=me&&me.id===p.owner;
  const view=b=>[h('h2',{class:'t'},p.title),h('div',{class:'meta'},h('a',{href:'#/u/'+p.profiles.handle},p.profiles.display||p.profiles.handle),' · '+fmt(p.created)+' · '+VIS[p.vis]),
    own?h('div',{class:'row',style:'margin-top:10px'},h('a',{class:'btn',href:'#/e/'+p.id},'수정'),h('button',{class:'d',onclick:async()=>{if(!confirm('삭제할까요?'))return;await sb.from('posts').delete().eq('id',p.id);go('#/u/'+prof.handle)}},'삭제')):null,
    b.images?.length?h('div',{class:'imgs'},b.images.map(u=>h('a',{href:u,target:'_blank'},h('img',{src:u,loading:'lazy'})))):null,
    h('div',{class:'box'},h('h4',{},'프롬프트'),chips(b.prompt),copyBtn(b.prompt)),
    b.negative?h('div',{class:'box'},h('h4',{},'네거티브 (UC)'),chips(b.negative,1),copyBtn(b.negative)):null,
    b.params?h('div',{class:'box'},h('h4',{},'설정'),h('div',{style:'white-space:pre-wrap'},b.params)):null,
    p.tags?.length?h('div',{class:'meta'},p.tags.map(x=>'#'+x).join(' ')):null];
  if(p.vis==='locked'&&!own){
    return shell([h('h2',{class:'t'},p.title),h('div',{class:'box'},h('h4',{},'🔑 비밀번호가 필요한 글이에요'),h('input',{id:'upw',type:'password'}),
      h('button',{class:'p',onclick:async()=>{const{data,error}=await sb.rpc('unlock_post',{pid:id,pw:$('upw').value});if(error)return err(error);if(!data?.length)return alert('비밀번호가 틀렸어요');shell(view(data[0]),t)}},'열기'))],t);
  }
  const{data:b}=await sb.from('bodies').select('*').eq('post_id',id).single();
  shell(view(b||{prompt:''}),t);
}
async function editor(id){
  if(!me)return go('#/login');
  let p=null,b={prompt:'',negative:'',params:'',images:[]};
  if(id){({data:p}=await sb.from('posts').select('*').eq('id',id).single());({data:b}=await sb.from('bodies').select('*').eq('post_id',id).single());b=b||{prompt:'',negative:'',params:'',images:[]}}
  let imgs=[...(b.images||[])];
  const tb=h('div',{class:'thumbs'});
  const drawT=()=>tb.replaceChildren(...imgs.map((u,i)=>h('div',{},h('img',{src:u}),h('button',{onclick:()=>{imgs.splice(i,1);drawT()}},'✕'))));drawT();
  const pw=h('input',{id:'fw',type:'password',placeholder:p?.vis==='locked'?'비워두면 기존 비밀번호 유지':'비밀번호 (4자 이상)'});
  const sel=h('select',{id:'fv'},Object.entries(VIS).map(([k,l])=>h('option',{value:k,selected:(p?.vis||'public')===k},l)));
  const pwBox=h('div',{},h('label',{},'글 비밀번호'),pw);const sync=()=>pwBox.style.display=sel.value==='locked'?'block':'none';sel.onchange=sync;sync();
  const file=h('input',{type:'file',accept:'image/*',multiple:true,onchange:async e=>{
    for(const f of e.target.files){if(f.size>8e6){alert(f.name+' 은(는) 8MB 초과');continue}
      const path=`${me.id}/${crypto.randomUUID()}.${(f.name.split('.').pop()||'png').toLowerCase()}`;
      const{error}=await sb.storage.from('images').upload(path,f);if(error){err(error);continue}
      imgs.push(sb.storage.from('images').getPublicUrl(path).data.publicUrl);drawT()}e.target.value=''}});
  shell(h('div',{},h('h2',{class:'t'},id?'글 수정':'새 글'),
    h('label',{},'제목'),h('input',{id:'ft',value:p?.title||''}),
    h('label',{},'프롬프트'),h('textarea',{id:'fp'},b.prompt),
    h('label',{},'네거티브 (UC)'),h('textarea',{id:'fn',style:'min-height:70px'},b.negative),
    h('label',{},'설정 메모 (모델 / 샘플러 / 스텝 / 시드…)'),h('textarea',{id:'fa',style:'min-height:60px'},b.params),
    h('label',{},'태그 (쉼표로 구분)'),h('input',{id:'fg',value:(p?.tags||[]).join(', ')}),
    h('label',{},'이미지'),tb,file,
    h('label',{},'공개 범위'),sel,pwBox,
    h('div',{class:'row'},h('button',{class:'p',onclick:async()=>{
      const vis=sel.value,pwv=pw.value;
      if(!$('fp').value.trim())return alert('프롬프트를 입력해 주세요');
      if(vis==='locked'&&p?.vis!=='locked'&&pwv.length<4)return alert('비밀번호는 4자 이상이에요');
      if(vis==='locked'&&pwv&&pwv.length<4)return alert('비밀번호는 4자 이상이에요');
      const row={title:$('ft').value.trim()||'제목 없음',tags:$('fg').value.split(',').map(x=>x.trim()).filter(Boolean),vis,cover:vis==='locked'?null:(imgs[0]||null),updated:new Date().toISOString()};
      try{let pid=id;
        if(id){const{error}=await sb.from('posts').update(row).eq('id',id);if(error)throw error}
        else{const{data,error}=await sb.from('posts').insert({...row,owner:me.id}).select().single();if(error)throw error;pid=data.id}
        const{error:e2}=await sb.from('bodies').upsert({post_id:pid,prompt:$('fp').value,negative:$('fn').value,params:$('fa').value,images:imgs});if(e2)throw e2;
        if(vis!=='locked'){await sb.rpc('set_post_password',{pid,pw:null})}else if(pwv){const{error}=await sb.rpc('set_post_password',{pid,pw:pwv});if(error)throw error}
        go('#/p/'+pid)}catch(e){err(e)}}},'저장'),h('button',{onclick:()=>history.back()},'취소'))));
}
function themeForm(){
  const t=draftTheme;const re=()=>skin(t);
  const sel=(k,opts)=>h('select',{onchange:e=>{t[k]=e.target.value;re()}},Object.entries(opts).map(([v,l])=>h('option',{value:v,selected:t[k]===v},l)));
  const bn=h('input',{type:'file',accept:'image/*',onchange:async e=>{const f=e.target.files[0];if(!f)return;const path=`${me.id}/banner-${crypto.randomUUID()}.${f.name.split('.').pop()}`;
    const{error}=await sb.storage.from('images').upload(path,f);if(error)return err(error);t.banner=sb.storage.from('images').getPublicUrl(path).data.publicUrl;alert('배너 선택됨. 저장을 눌러주세요')}});
  return h('div',{class:'box'},h('h4',{},'내 블로그 꾸미기 (바로 미리보기돼요)'),
    h('label',{},'강조 색'),h('input',{type:'color',value:t.accent,oninput:e=>{t.accent=e.target.value;re()}}),
    h('label',{},'분위기'),sel('mode',{light:'밝게',dark:'어둡게',mist:'민트 안개'}),
    h('label',{},'글꼴'),sel('font',{sans:'고딕',serif:'명조',mono:'모노'}),
    h('label',{},'글 목록 모양'),sel('layout',{list:'리스트',grid:'격자',mag:'매거진'}),
    h('label',{},'배너 이미지'),bn,t.banner?h('button',{onclick:()=>{delete t.banner;alert('배너 제거됨. 저장을 눌러주세요')}},'배너 제거'):null);
}
async function settings(){
  if(!me)return go('#/login');
  draftTheme={...th(prof)};
  const{data:inv}=await sb.from('invites').select('*').order('created',{ascending:false});
  const link=c=>location.href.split('#')[0]+'#/login?code='+c;
  const dn=h('input',{value:prof.display}),bio=h('textarea',{style:'min-height:60px;font-family:inherit'},prof.bio);
  const imp=h('input',{type:'file',accept:'.json',onchange:async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;
    for(const it of j.items){const{data,error}=await sb.from('posts').insert({owner:me.id,title:it.title,tags:it.tags||[],vis:it.vis==='locked'?'private':it.vis,cover:it.vis==='public'?it.images?.[0]||null:null}).select().single();if(error)throw error;
      await sb.from('bodies').insert({post_id:data.id,prompt:it.prompt||'',negative:it.negative||'',params:it.params||'',images:it.images||[]});n++}
    alert(n+'개 가져왔어요 (비밀번호 글은 비공개로 들어와요)');go('#/u/'+prof.handle)}catch(x){err(x)}}});
  shell(h('div',{},h('h2',{class:'t'},'설정'),
    h('div',{class:'box'},h('label',{},'블로그 이름'),dn,h('label',{},'소개'),bio),
    themeForm(),
    h('button',{class:'p',onclick:async()=>{const{error}=await sb.from('profiles').update({display:dn.value,bio:bio.value,theme:draftTheme}).eq('id',me.id);if(error)return err(error);await loadProf();alert('저장됨');go('#/u/'+prof.handle)}},'저장'),
    h('div',{class:'box'},h('h4',{},'추천 코드'+(prof.is_admin?'':' (최대 3개)')),h('p',{class:'mu'},'친구가 이 코드로 가입하면 자기 블로그가 생겨요.'),
      (inv||[]).map(i=>h('div',{class:'row',style:'margin:6px 0'},h('b',{},i.code),h('span',{class:'mu'},i.uses+'/'+i.max_uses+' 사용'),copyBtn(link(i.code),'초대 링크 복사'))),
      h('button',{onclick:async()=>{const{error}=await sb.rpc('create_invite');if(error)return err(error);settings()}},'새 코드 만들기')),
    h('div',{class:'box'},h('h4',{},'백업 / 가져오기'),
      h('div',{class:'row'},h('button',{onclick:async()=>{const{data:ps}=await sb.from('posts').select('*').eq('owner',me.id);const{data:bs}=await sb.from('bodies').select('*').in('post_id',(ps||[]).map(p=>p.id));
        const bm=Object.fromEntries((bs||[]).map(b=>[b.post_id,b]));const items=(ps||[]).map(p=>({title:p.title,tags:p.tags,vis:p.vis,created:p.created,...(bm[p.id]||{}),post_id:undefined}));
        const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify({items},null,1)],{type:'application/json'})),download:'prompt-backup-'+new Date().toISOString().slice(0,10)+'.json'});a.click()}},'⬇ 전체 백업 (JSON)')),
      h('div',{class:'sp'}),h('label',{},'백업 파일 가져오기'),imp),
    h('div',{class:'box'},h('button',{class:'d',onclick:async()=>{await sb.auth.signOut();go('#/')}},'로그아웃'))));
}
function login(){
  const q=new URLSearchParams((location.hash.split('?')[1]||'')),code0=q.get('code')||'';
  let mode=code0?'up':'in';
  const draw=()=>{
    const f=h('div',{class:'box'},
      h('div',{class:'row'},h('button',{class:mode==='in'?'p':'',onclick:()=>{mode='in';draw()}},'로그인'),h('button',{class:mode==='up'?'p':'',onclick:()=>{mode='up';draw()}},'가입')),h('div',{class:'sp'}),
      h('label',{},'이메일'),h('input',{id:'le',type:'email',autocomplete:'email'}),
      h('label',{},'비밀번호'),h('input',{id:'lp',type:'password',autocomplete:mode==='in'?'current-password':'new-password'}),
      mode==='up'?[h('label',{},'주소용 아이디 (영문 소문자/숫자/_ 3~20자)'),h('input',{id:'lh'}),h('label',{},'블로그 이름'),h('input',{id:'ld'}),h('label',{},'추천 코드 (첫 가입자는 비워도 돼요)'),h('input',{id:'lc',value:code0})]:null,
      h('button',{class:'p',onclick:async()=>{
        const email=$('le').value.trim(),password=$('lp').value;
        if(mode==='in'){const{error}=await sb.auth.signInWithPassword({email,password});return error?err(error):go('#/me')}
        const handle=$('lh').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(handle))return alert('아이디 형식을 확인해 주세요');
        const{data:ok}=await sb.rpc('signup_open',{c:$('lc').value.trim()});if(!ok)return alert('유효하지 않은 추천 코드예요');
        const{data,error}=await sb.auth.signUp({email,password,options:{data:{handle,display:$('ld').value.trim(),code:$('lc').value.trim()},emailRedirectTo:location.href.split('#')[0]}});
        if(error)return err(error);alert(data.session?'가입 완료!':'확인 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요.');if(data.session)go('#/me')}},mode==='in'?'로그인':'가입하기'),
      mode==='in'?h('p',{},h('a',{href:'#',class:'mu',onclick:async e=>{e.preventDefault();const em=$('le').value.trim();if(!em)return alert('이메일을 먼저 입력해 주세요');
        const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});error?err(error):alert('재설정 메일을 보냈어요')}},'비밀번호를 잊으셨나요?')):null);
    shell([h('h2',{class:'t'},'프롬프트 블로그'),f]);};draw();
}
function recoveryForm(){
  shell(h('div',{class:'box'},h('h4',{},'새 비밀번호 설정'),h('input',{id:'np',type:'password'}),
    h('button',{class:'p',onclick:async()=>{const{error}=await sb.auth.updateUser({password:$('np').value});if(error)return err(error);recovery=false;alert('변경됐어요');go('#/me');route()}},'변경')));
}

// ---------- 라우터 ----------
async function loadProf(){const{data:{session}}=await sb.auth.getSession();me=session?.user||null;prof=null;
  if(me){const{data}=await sb.from('profiles').select('*').eq('id',me.id).single();prof=data}}
async function route(){
  if(SB_URL.startsWith('YOUR'))return shell(h('div',{class:'box'},'index.html 위쪽의 SB_URL, SB_KEY 를 Supabase 값으로 바꿔 주세요.'));
  if(recovery)return recoveryForm();
  const[path]=(location.hash||'#/').slice(1).split('?'),s=path.split('/').filter(Boolean);
  try{
    if(!s.length)return home();
    if(s[0]==='u')return blog(s[1]);
    if(s[0]==='p')return post(s[1]);
    if(s[0]==='new')return editor();
    if(s[0]==='e')return editor(s[1]);
    if(s[0]==='me')return settings();
    if(s[0]==='login')return login();
    home();
  }catch(e){err(e)}
}
sb.auth.onAuthStateChange(async(ev)=>{if(ev==='PASSWORD_RECOVERY')recovery=true;if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='PASSWORD_RECOVERY'){await loadProf();route()}});
window.addEventListener('hashchange',route);
(async()=>{await loadProf();route()})();
</script></body></html>
