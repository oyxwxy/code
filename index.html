<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프롬프트 블로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Noto+Serif+KR:wght@400;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
.skin{--bg:#f7f8fa;--fg:#14161a;--card:#fff;--bd:#e3e5ea;--mu:#6b7280;--ac:#5b6cff;--ff:'Noto Sans KR',sans-serif}
.skin.dark{--bg:#111318;--fg:#e8eaf0;--card:#1b1e26;--bd:#2a2e39;--mu:#9097a8}
.skin.mist{--bg:#e9efee;--fg:#16231f;--card:#f5f9f8;--bd:#cfdcd9;--mu:#5b706a}
.skin.f-serif{--ff:'Noto Serif KR',serif}.skin.f-mono{--ff:'IBM Plex Mono','Noto Sans KR',monospace}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
.skin{min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.7 var(--ff);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto;padding:14px 18px}
.top b{font-size:18px;flex:1}.top a{font-size:14px;color:var(--mu)}.top a:hover{color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:6px 18px 90px}
.banner{height:150px;border-radius:14px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 30%,var(--bg)));background-size:cover;background-position:center;margin-bottom:14px}
.bh h1{margin:0;font-size:28px;line-height:1.3}.bh p{margin:4px 0 18px;color:var(--mu)}
.feed{display:flex;flex-direction:column;gap:14px}
.feed.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.feed.mag{display:grid;grid-template-columns:1fr 1fr}.feed.mag .post:first-child{grid-column:1/-1}
@media(max-width:520px){.feed.mag{grid-template-columns:1fr}}
.post{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.feed:not(.grid):not(.mag) .post{flex-direction:row}
.feed:not(.grid):not(.mag) .th{width:120px;min-height:100px;flex:none}
.th{aspect-ratio:4/3;background:color-mix(in srgb,var(--ac) 18%,var(--card)) center/cover;display:grid;place-items:center;font-size:28px;color:var(--ac)}
.mag .post:first-child .th{aspect-ratio:21/9}
.pb{padding:12px 14px}.pb h3{margin:0 0 4px;font-size:17px;line-height:1.4}
.meta{font-size:12px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{font:12px/1 'IBM Plex Mono',monospace;padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--fg);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--card))}
.chip.neg{background:color-mix(in srgb,#e33 12%,var(--card));border-color:color-mix(in srgb,#e33 30%,var(--card))}
h2.t{font-size:26px;line-height:1.35;margin:8px 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0}
.imgs img{width:100%;border-radius:10px;display:block}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.box h4{margin:0 0 6px;font-size:14px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:600 14px var(--ff);padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:#d33}
input,textarea,select{width:100%;font:15px var(--ff);padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--fg);margin:4px 0 10px}
textarea{min-height:110px;resize:vertical;font-family:'IBM Plex Mono','Noto Sans KR',monospace;font-size:13px}
label{font-size:13px;color:var(--mu);font-weight:600}
input[type=color]{padding:2px;height:40px;width:70px}input[type=checkbox]{width:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px}
.mu{color:var(--mu);font-size:14px}.sp{height:10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head>
<body><div id="root" class="skin"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,collection,query,where,limit,writeBatch,increment}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ====== 여기만 바꾸세요 (Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) > firebaseConfig) ======
const firebaseConfig={
  apiKey:"AIzaSyCPcmzZ7K61n7GYG6TuozrOxlr10bqcUcQ",
  authDomain:"code-94e7e.firebaseapp.com",
  projectId:"code-94e7e",
  storageBucket:"code-94e7e.firebasestorage.app",
  messagingSenderId:"232867379460",
  appId:"1:232867379460:web:048d2fd7b38cb05128f851"
};
// ======================================================================================
const configured=!firebaseConfig.apiKey.startsWith('YOUR');
const app=configured?initializeApp(firebaseConfig):null;
const auth=configured?getAuth(app):null,db=configured?getFirestore(app):null;
const $root=document.getElementById('root');
let me=null,prof=null,draftTheme=null,signing=false;
const VIS={public:'🌐 공개',locked:'🔑 비밀번호',private:'🔒 비공개'};
function h(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const $=id=>document.getElementById(id);
const fmt=d=>new Date(d).toLocaleDateString('ko-KR');
const err=e=>alert(e?.message||e);
const go=p=>{location.hash=p};
const DEF={accent:'#5b6cff',mode:'light',font:'sans',layout:'list'};
const th=p=>({...DEF,...(p?.theme||{})});

// ---------- 암호화 (비밀번호 글) ----------
// 글마다 랜덤 키 K 로 본문을 암호화 → K 를 (a) 글 비밀번호로 감싼 것, (b) 내 금고 키로 감싼 것, 두 벌 저장.
// 그래서 글 비밀번호를 잊어도 내 계정으로 로그인해 새 비밀번호를 정할 수 있어요.
const te=new TextEncoder(),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ak=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function seal(k,data){const iv=rnd(12);return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,data))}}
const unseal=(k,o)=>crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.ct));
async function pwk(pw,salt){const m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function getMK(){const r=doc(db,'users',me.uid,'private','vault'),s=await getDoc(r);if(s.exists())return ak(ub(s.data().mk));const raw=rnd(32);await setDoc(r,{mk:b64(raw)});return ak(raw)}
const dj=buf=>JSON.parse(new TextDecoder().decode(buf));
async function ownerOpen(b){const K=new Uint8Array(await unseal(await getMK(),b.kOwner));return{K,data:dj(await unseal(await ak(K),b.enc))}}
async function pwOpen(b,pw){const K=await unseal(await pwk(pw,ub(b.kPw.salt)),b.kPw);return dj(await unseal(await ak(K),b.enc))}
async function lockBody(payload,pw,old){
  const K=old?.kOwner?(await ownerOpen(old)).K:rnd(32);
  const o={owner:me.uid,vis:'locked',enc:await seal(await ak(K),te.encode(JSON.stringify(payload))),kOwner:await seal(await getMK(),K)};
  if(pw){const salt=rnd(16);o.kPw={salt:b64(salt),...await seal(await pwk(pw,salt),K)}}else o.kPw=old.kPw;
  return o}
async function readBody(b,own){if(b.vis==='locked')return own?(await ownerOpen(b)).data:null;return b}

// ---------- 공통 ----------
const pc={};const prof$=uid=>pc[uid]??=getDoc(doc(db,'profiles',uid)).then(s=>s.exists()?{id:uid,...s.data()}:null);
async function listPosts(q){const s=await getDocs(q);const ps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);
  await Promise.all(ps.map(async p=>p.profiles=await prof$(p.owner)));return ps}
// 이미지는 브라우저에서 줄여서(JPEG) Firestore 문서로 저장 → Storage/결제 불필요
function shrink(src,maxPx,q,limit){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{let s=Math.min(1,maxPx/Math.max(im.width,im.height)),out;
  for(let i=0;i<10;i++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<limit)break;s*=.85;q=Math.max(.6,q-.05)}
  out.length<limit?res(out):rej(new Error('이미지가 너무 커요'))};im.onerror=()=>rej(new Error('이미지를 읽을 수 없어요'));im.src=src})}
const fileUrl=f=>URL.createObjectURL(f);
const imgCache={};const imgData=id=>imgCache[id]??=getDoc(doc(db,'images',id)).then(s=>s.data()?.d||'');
async function saveImg(dataUrl){const id=crypto.randomUUID();await setDoc(doc(db,'images',id),{owner:me.uid,d:dataUrl});imgCache[id]=Promise.resolve(dataUrl);return id}
async function addImage(f){return saveImg(await shrink(fileUrl(f),1600,.88,900000))}
function imgEl(id){const i=h('img',{loading:'lazy'});imgData(id).then(d=>i.src=d);return i}
function skin(t){t={...DEF,...t};$root.className='skin '+(t.mode==='light'?'':t.mode)+' f-'+t.font;$root.style.setProperty('--ac',t.accent)}
function shell(content,t){
  skin(t||th(prof));
  const nav=h('div',{class:'top'},h('b',{},h('a',{href:'#/'},'🎨 프롬프트 블로그')),
    me&&prof?[h('a',{href:'#/new'},'글쓰기'),h('a',{href:'#/u/'+prof.handle},'내 블로그'),h('a',{href:'#/me'},'설정')]:h('a',{href:'#/login'},'로그인'));
  $root.replaceChildren(nav,h('main',{},content));
}
function chips(txt,neg){return h('div',{class:'chips'},txt.split(/,(?![^()]*\))/).map(s=>s.trim()).filter(Boolean).map(s=>h('span',{class:'chip'+(neg?' neg':'')},s)))}
function copyBtn(txt,l='복사'){return h('button',{onclick:()=>navigator.clipboard.writeText(txt).then(()=>alert('복사됨'))},l)}
function feed(posts,layout){
  if(!posts.length)return h('p',{class:'mu'},'아직 글이 없어요.');
  return h('div',{class:'feed '+(layout==='grid'?'grid':layout==='mag'?'mag':'')},posts.map(p=>h('a',{class:'post',href:'#/p/'+p.id},
    h('div',{class:'th',style:p.cover?`background-image:url("${p.cover}")`:''},p.cover?'':(p.vis==='locked'?'🔑':'✦')),
    h('div',{class:'pb'},h('h3',{},p.title),h('div',{class:'meta'},(p.profiles?.display?p.profiles.display+' · ':'')+fmt(p.created)+(p.vis!=='public'?' · '+VIS[p.vis]:'')),
      p.tags?.length?h('div',{class:'meta'},p.tags.slice(0,5).map(x=>'#'+x).join(' ')):null))));
}

// ---------- 페이지들 ----------
async function home(){
  shell(h('p',{class:'mu'},'불러오는 중…'));
  const ps=await listPosts(query(collection(db,'posts'),where('vis','in',['public','locked']),limit(100)));
  shell([h('div',{class:'bh'},h('h1',{},'최근 올라온 프롬프트'),h('p',{},'멤버들이 공유한 글이에요.')),feed(ps,th(prof).layout)]);
}
async function blog(handle){
  const hs=await getDoc(doc(db,'handles',handle));
  const pf=hs.exists()?await prof$(hs.data().uid):null;
  if(!pf)return shell(h('p',{},'블로그를 찾을 수 없어요.'));
  const t=th(pf),own=me&&me.uid===pf.id;
  const q=own?query(collection(db,'posts'),where('owner','==',pf.id)):query(collection(db,'posts'),where('owner','==',pf.id),where('vis','in',['public','locked']));
  const ps=await listPosts(q);
  shell([h('div',{class:'banner',style:t.banner?`background-image:url("${t.banner}")`:''}),h('div',{class:'bh'},h('h1',{},pf.display||pf.handle),h('p',{},pf.bio||'@'+pf.handle)),
    own?h('p',{},h('a',{class:'btn p',href:'#/new'},'+ 새 글')):null,feed(ps,t.layout)],t);
}
async function post(id){
  let ps;try{ps=await getDoc(doc(db,'posts',id))}catch(e){}
  if(!ps?.exists())return shell(h('p',{},'글을 찾을 수 없거나 볼 권한이 없어요.'));
  const p={id,...ps.data()},pf=await prof$(p.owner),t=th(pf),own=me&&me.uid===p.owner;
  const view=b=>[h('h2',{class:'t'},p.title),h('div',{class:'meta'},h('a',{href:'#/u/'+pf.handle},pf.display||pf.handle),' · '+fmt(p.created)+' · '+VIS[p.vis]),
    own?h('div',{class:'row',style:'margin-top:10px'},h('a',{class:'btn',href:'#/e/'+p.id},'수정'),h('button',{class:'d',onclick:async()=>{if(!confirm('삭제할까요?'))return;for(const im of b.images||[])await deleteDoc(doc(db,'images',im)).catch(()=>{});const w=writeBatch(db);w.delete(doc(db,'posts',id));w.delete(doc(db,'bodies',id));await w.commit();go('#/u/'+prof.handle)}},'삭제')):null,
    b.images?.length?h('div',{class:'imgs'},b.images.map(id=>h('a',{href:'#',onclick:e=>{e.preventDefault();imgData(id).then(d=>{const w=open('');w.document.write('<body style="margin:0;background:#000"><img src="'+d+'" style="max-width:100%;display:block;margin:auto">')})}},imgEl(id)))):null,
    h('div',{class:'box'},h('h4',{},'프롬프트'),chips(b.prompt||''),copyBtn(b.prompt||'')),
    b.negative?h('div',{class:'box'},h('h4',{},'네거티브 (UC)'),chips(b.negative,1),copyBtn(b.negative)):null,
    b.params?h('div',{class:'box'},h('h4',{},'설정'),h('div',{style:'white-space:pre-wrap'},b.params)):null,
    p.tags?.length?h('div',{class:'meta'},p.tags.map(x=>'#'+x).join(' ')):null];
  const body=(await getDoc(doc(db,'bodies',id))).data()||{prompt:''};
  if(p.vis==='locked'&&!own)
    return shell([h('h2',{class:'t'},p.title),h('div',{class:'box'},h('h4',{},'🔑 비밀번호가 필요한 글이에요'),h('input',{id:'upw',type:'password'}),
      h('button',{class:'p',onclick:async()=>{try{shell(view(await pwOpen(body,$('upw').value)),t)}catch(e){alert('비밀번호가 틀렸어요')}}},'열기'))],t);
  shell(view(await readBody(body,own)),t);
}
async function editor(id){
  if(!me||!prof)return go('#/login');
  let p=null,old=null,b={prompt:'',negative:'',params:'',images:[]};
  if(id){const ps=await getDoc(doc(db,'posts',id));p=ps.data();old=(await getDoc(doc(db,'bodies',id))).data();b=old?await readBody(old,true):b}
  let imgs=[...(b.images||[])];
  const tb=h('div',{class:'thumbs'});
  const drawT=()=>tb.replaceChildren(...imgs.map((id,i)=>h('div',{},imgEl(id),h('button',{onclick:()=>{imgs.splice(i,1);drawT()}},'✕'))));drawT();
  const pw=h('input',{id:'fw',type:'password',placeholder:p?.vis==='locked'?'비워두면 기존 비밀번호 유지 / 입력하면 새 비밀번호':'비밀번호 (4자 이상)'});
  const sel=h('select',{id:'fv'},Object.entries(VIS).map(([k,l])=>h('option',{value:k,selected:(p?.vis||'public')===k},l)));
  const pwBox=h('div',{},h('label',{},'글 비밀번호'),pw);const sync=()=>pwBox.style.display=sel.value==='locked'?'block':'none';sel.onchange=sync;sync();
  const file=h('input',{type:'file',accept:'image/*',multiple:true,onchange:async e=>{
    for(const f of e.target.files){try{imgs.push(await addImage(f));drawT()}catch(x){err(x)}}e.target.value=''}});
  shell(h('div',{},h('h2',{class:'t'},id?'글 수정':'새 글'),
    h('label',{},'제목'),h('input',{id:'ft',value:p?.title||''}),
    h('label',{},'프롬프트'),h('textarea',{id:'fp'},b.prompt),
    h('label',{},'네거티브 (UC)'),h('textarea',{id:'fn',style:'min-height:70px'},b.negative),
    h('label',{},'설정 메모 (모델 / 샘플러 / 스텝 / 시드…)'),h('textarea',{id:'fa',style:'min-height:60px'},b.params),
    h('label',{},'태그 (쉼표로 구분)'),h('input',{id:'fg',value:(p?.tags||[]).join(', ')}),
    h('label',{},'이미지'),tb,file,
    h('label',{},'공개 범위'),sel,pwBox,
    h('div',{class:'row'},h('button',{class:'p',onclick:async()=>{
      const vis=sel.value,pwv=pw.value,wasLocked=old?.vis==='locked';
      if(!$('fp').value.trim())return alert('프롬프트를 입력해 주세요');
      if(vis==='locked'&&(!wasLocked&&pwv.length<4||pwv&&pwv.length<4))return alert('비밀번호는 4자 이상이에요');
      const payload={prompt:$('fp').value,negative:$('fn').value,params:$('fa').value,images:imgs};
      try{
        const pid=id||doc(collection(db,'posts')).id,now=Date.now();
        const bd=vis==='locked'?await lockBody(payload,pwv,wasLocked?old:null):{owner:me.uid,vis,...payload};
        const cover=vis==='public'&&imgs[0]?await shrink(await imgData(imgs[0]),360,.72,70000):null;
        for(const im of(b.images||[]).filter(x=>!imgs.includes(x)))deleteDoc(doc(db,'images',im)).catch(()=>{});
        const w=writeBatch(db);
        w.set(doc(db,'posts',pid),{owner:me.uid,title:$('ft').value.trim()||'제목 없음',tags:$('fg').value.split(',').map(x=>x.trim()).filter(Boolean),vis,cover,created:p?.created||now,updated:now});
        w.set(doc(db,'bodies',pid),bd);await w.commit();go('#/p/'+pid)}catch(e){err(e)}}},'저장'),h('button',{onclick:()=>history.back()},'취소'))));
}
function themeForm(){
  const t=draftTheme,re=()=>skin(t);
  const sel=(k,opts)=>h('select',{onchange:e=>{t[k]=e.target.value;re()}},Object.entries(opts).map(([v,l])=>h('option',{value:v,selected:t[k]===v},l)));
  const bn=h('input',{type:'file',accept:'image/*',onchange:async e=>{const f=e.target.files[0];if(!f)return;try{t.banner=await shrink(fileUrl(f),900,.7,120000);alert('배너 선택됨. 저장을 눌러주세요')}catch(x){err(x)}}});
  return h('div',{class:'box'},h('h4',{},'내 블로그 꾸미기 (바로 미리보기돼요)'),
    h('label',{},'강조 색'),h('input',{type:'color',value:t.accent,oninput:e=>{t.accent=e.target.value;re()}}),
    h('label',{},'분위기'),sel('mode',{light:'밝게',dark:'어둡게',mist:'민트 안개'}),
    h('label',{},'글꼴'),sel('font',{sans:'고딕',serif:'명조',mono:'모노'}),
    h('label',{},'글 목록 모양'),sel('layout',{list:'리스트',grid:'격자',mag:'매거진'}),

}
async function newInvite(){
  let max=1;if(prof.isAdmin){max=parseInt(prompt('몇 명까지 쓸 수 있는 코드로 할까요?','1'))||1}
  const code=Array.from(rnd(8),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
  const w=writeBatch(db);w.set(doc(db,'invites',code),{owner:me.uid,max,uses:0,created:Date.now()});
  if(!prof.isAdmin)w.update(doc(db,'profiles',me.uid),{inviteCount:increment(1)});
  await w.commit();await loadProf();
}

  draftTheme={...th(prof)};
  const inv=(await getDocs(query(collection(db,'invites'),where('owner','==',me.uid)))).docs.map(d=>({code:d.id,...d.data()})).sort((a,b)=>b.created-a.created);

    for(const it of j.items){const ids=[];for(const im of it.images||[])if(String(im).startsWith('data:'))ids.push(await saveImg(im));const cv=it.vis==='public'&&it.images?.[0]?.startsWith?.('data:')?await shrink(it.images[0],360,.72,70000):null;const pid=doc(collection(db,'posts')).id,vis=it.vis==='locked'?'private':it.vis,now=Date.now();const w=writeBatch(db);
      w.set(doc(db,'posts',pid),{owner:me.uid,title:it.title||'제목 없음',tags:it.tags||[],vis,cover:cv,created:it.created||now,updated:now});
      w.set(doc(db,'bodies',pid),{owner:me.uid,vis,prompt:it.prompt||'',negative:it.negative||'',params:it.params||'',images:ids});await w.commit();n++}
    alert(n+'개 가져왔어요 (비밀번호 글은 비공개로 들어와요)');go('#/u/'+prof.handle)}catch(x){err(x)}}});
  shell(h('div',{},h('h2',{class:'t'},'설정'),

    h('div',{class:'box'},h('h4',{},'추천 코드'+(prof.isAdmin?'':` (${prof.inviteCount}/3 사용)`)),h('p',{class:'mu'},'친구가 이 코드로 가입하면 자기 블로그가 생겨요.'),
      inv.map(i=>h('div',{class:'row',style:'margin:6px 0'},h('b',{},i.code),h('span',{class:'mu'},i.uses+'/'+i.max+' 사용'),copyBtn(link(i.code),'초대 링크 복사'))),

    h('div',{class:'box'},h('h4',{},'백업 / 가져오기'),

      h('div',{class:'row'},h('button',{onclick:async()=>{
        const ps=(await getDocs(query(collection(db,'posts'),where('owner','==',me.uid)))).docs.map(d=>({id:d.id,...d.data()}));const items=[];
        for(const p of ps){const b=(await getDoc(doc(db,'bodies',p.id))).data();const d=b?await readBody(b,true):{};items.push({title:p.title,tags:p.tags,vis:p.vis,created:p.created,prompt:d.prompt,negative:d.negative,params:d.params,images:await Promise.all((d.images||[]).map(imgData))})}
        h('a',{href:URL.createObjectURL(new Blob([JSON.stringify({items},null,1)],{type:'application/json'})),download:'prompt-backup-'+new Date().toISOString().slice(0,10)+'.json'}).click()}},'⬇ 전체 백업 (JSON)')),
      h('div',{class:'sp'}),h('label',{},'백업 파일 가져오기'),imp),
    h('div',{class:'box'},h('button',{class:'d',onclick:async()=>{await signOut(auth);go('#/')}},'로그아웃'))));

async function doSignup(email,pw,handle,display,code){
  const first=!(await getDoc(doc(db,'meta','admin'))).exists();code=code.toUpperCase();let inviteOwner=null;
  if(!first){const iv=await getDoc(doc(db,'invites',code));if(!code||!iv.exists()||iv.data().uses>=iv.data().max)throw new Error('유효하지 않거나 이미 다 쓴 추천 코드예요');inviteOwner=iv.data().owner}
  if((await getDoc(doc(db,'handles',handle))).exists())throw new Error('이미 사용 중인 아이디예요');
  signing=true;
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pw),uid=cred.user.uid,w=writeBatch(db);
    w.set(doc(db,'profiles',uid),{handle,display:display||handle,bio:'',isAdmin:first,theme:{},inviteCount:0,inviteCode:first?'':code,invitedBy:inviteOwner,created:Date.now()});
    w.set(doc(db,'handles',handle),{uid});
    if(first)w.set(doc(db,'meta','admin'),{uid});else w.update(doc(db,'invites',code),{uses:increment(1)});
    try{await w.commit()}catch(e){await cred.user.delete();throw new Error('가입에 실패했어요. 코드와 아이디를 확인해 주세요.')}
  }finally{signing=false}
  await loadProf();
}
function login(){
  const q=new URLSearchParams(location.hash.split('?')[1]||''),code0=q.get('code')||'';
  let mode=code0?'up':'in';
  const draw=()=>{
    const f=h('div',{class:'box'},
      h('div',{class:'row'},h('button',{class:mode==='in'?'p':'',onclick:()=>{mode='in';draw()}},'로그인'),h('button',{class:mode==='up'?'p':'',onclick:()=>{mode='up';draw()}},'가입')),h('div',{class:'sp'}),
      h('label',{},'이메일'),h('input',{id:'le',type:'email',autocomplete:'email'}),
      h('label',{},'비밀번호 (가입 시 6자 이상)'),h('input',{id:'lp',type:'password',autocomplete:mode==='in'?'current-password':'new-password'}),
      mode==='up'?[h('label',{},'주소용 아이디 (영문 소문자/숫자/_ 3~20자)'),h('input',{id:'lh'}),h('label',{},'블로그 이름'),h('input',{id:'ld'}),h('label',{},'추천 코드 (첫 가입자는 비워도 돼요)'),h('input',{id:'lc',value:code0})]:null,
      h('button',{class:'p',onclick:async()=>{
        const email=$('le').value.trim(),password=$('lp').value;
        try{
          if(mode==='in'){await signInWithEmailAndPassword(auth,email,password);return go('#/me')}
          const handle=$('lh').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(handle))return alert('아이디 형식을 확인해 주세요');
          await doSignup(email,password,handle,$('ld').value.trim(),$('lc').value.trim());go('#/me');
        }catch(e){err(e)}}},mode==='in'?'로그인':'가입하기'),
      mode==='in'?h('p',{},h('a',{href:'#',class:'mu',onclick:async e=>{e.preventDefault();const em=$('le').value.trim();if(!em)return alert('이메일을 먼저 입력해 주세요');
        try{await sendPasswordResetEmail(auth,em);alert('재설정 메일을 보냈어요')}catch(x){err(x)}}},'비밀번호를 잊으셨나요?')):null);
    shell([h('h2',{class:'t'},'프롬프트 블로그'),f]);};draw();
}

// ---------- 라우터 ----------
async function loadProf(){prof=me?(await getDoc(doc(db,'profiles',me.uid))).data()||null:null}
async function route(){
  if(!configured){return shell(h('div',{class:'box'},'index.html 위쪽의 firebaseConfig 를 Firebase 값으로 바꿔 주세요.'))}
  const[path]=(location.hash||'#/').slice(1).split('?'),s=path.split('/').filter(Boolean);
  try{
    if(!s.length)return await home();
    if(s[0]==='u')return await blog(s[1]);
    if(s[0]==='p')return await post(s[1]);
    if(s[0]==='new')return await editor();
    if(s[0]==='e')return await editor(s[1]);
    if(s[0]==='me')return await settings();
    if(s[0]==='login')return login();
    home();
  }catch(e){err(e)}
}
window.addEventListener('hashchange',route);
if(configured)onAuthStateChanged(auth,async u=>{if(signing)return;me=u;await loadProf();route()});else route();
</script></body></html>
